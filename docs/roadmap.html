<title>綠電媒合平台 · Roadmap 看板</title>
<style>
  :root{
    --bg:#f5f7fa;--panel:#fff;--panel2:#fbfcfe;--ink:#131c2e;--muted:#5d6b82;--faint:#93a1b8;
    --line:#e5e9f0;--line2:#d6dde9;--brand:#4c6ef5;
    --c1:#2fa24d;--c1s:rgba(47,162,77,.10);--c1b:rgba(47,162,77,.32);
    --c2:#0c9aa0;--c2s:rgba(12,154,160,.10);--c2b:rgba(12,154,160,.32);
    --c3:#4c6ef5;--c3s:rgba(76,110,245,.09);--c3b:rgba(76,110,245,.30);
    --c4:#e07a10;--c4s:rgba(224,122,16,.10);--c4b:rgba(224,122,16,.32);
    --c5:#e1444f;--c5s:rgba(225,68,79,.10);--c5b:rgba(225,68,79,.32);
    --c6:#8b5cf6;--c6s:rgba(139,92,246,.10);--c6b:rgba(139,92,246,.32);
    --c7:#0e7c9a;--c7s:rgba(14,124,154,.10);--c7b:rgba(14,124,154,.32);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#0b1220;--panel:#111b2b;--panel2:#0e1725;--ink:#e7edf6;--muted:#95a4bd;--faint:#66788f;
    --line:#20304a;--line2:#2b3c57;--brand:#7290ff;
    --c1:#4fce74;--c1s:rgba(79,206,116,.13);--c1b:rgba(79,206,116,.34);
    --c2:#2fc0be;--c2s:rgba(47,192,190,.13);--c2b:rgba(47,192,190,.34);
    --c3:#7290ff;--c3s:rgba(114,144,255,.12);--c3b:rgba(114,144,255,.34);
    --c4:#f0a63c;--c4s:rgba(240,166,60,.13);--c4b:rgba(240,166,60,.34);
    --c5:#ff6068;--c5s:rgba(255,96,104,.13);--c5b:rgba(255,96,104,.34);
    --c6:#a98bff;--c6s:rgba(169,139,255,.13);--c6b:rgba(169,139,255,.34);
    --c7:#39b6d8;--c7s:rgba(57,182,216,.13);--c7b:rgba(57,182,216,.34);
  }}
  :root[data-theme="light"]{--bg:#f5f7fa;--panel:#fff;--panel2:#fbfcfe;--ink:#131c2e;--muted:#5d6b82;--faint:#93a1b8;--line:#e5e9f0;--line2:#d6dde9;--brand:#4c6ef5;--c1:#2fa24d;--c1s:rgba(47,162,77,.10);--c1b:rgba(47,162,77,.32);--c2:#0c9aa0;--c2s:rgba(12,154,160,.10);--c2b:rgba(12,154,160,.32);--c3:#4c6ef5;--c3s:rgba(76,110,245,.09);--c3b:rgba(76,110,245,.30);--c4:#e07a10;--c4s:rgba(224,122,16,.10);--c4b:rgba(224,122,16,.32);--c5:#e1444f;--c5s:rgba(225,68,79,.10);--c5b:rgba(225,68,79,.32);--c6:#8b5cf6;--c6s:rgba(139,92,246,.10);--c6b:rgba(139,92,246,.32);--c7:#0e7c9a;--c7s:rgba(14,124,154,.10);--c7b:rgba(14,124,154,.32)}
  :root[data-theme="dark"]{--bg:#0b1220;--panel:#111b2b;--panel2:#0e1725;--ink:#e7edf6;--muted:#95a4bd;--faint:#66788f;--line:#20304a;--line2:#2b3c57;--brand:#7290ff;--c1:#4fce74;--c1s:rgba(79,206,116,.13);--c1b:rgba(79,206,116,.34);--c2:#2fc0be;--c2s:rgba(47,192,190,.13);--c2b:rgba(47,192,190,.34);--c3:#7290ff;--c3s:rgba(114,144,255,.12);--c3b:rgba(114,144,255,.34);--c4:#f0a63c;--c4s:rgba(240,166,60,.13);--c4b:rgba(240,166,60,.34);--c5:#ff6068;--c5s:rgba(255,96,104,.13);--c5b:rgba(255,96,104,.34);--c6:#a98bff;--c6s:rgba(169,139,255,.13);--c6b:rgba(169,139,255,.34);--c7:#39b6d8;--c7s:rgba(57,182,216,.13);--c7b:rgba(57,182,216,.34)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .top{padding:20px 26px 14px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
  .t1{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .kick{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
  .top h1{font-size:22px;margin:0;letter-spacing:-.01em}
  .meta{font-size:12.5px;color:var(--muted)} .meta b{color:var(--ink);font-weight:650}
  .sub{font-size:12.5px;color:var(--faint);margin-top:6px}
  .sub b{color:var(--muted)}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
  .chip{cursor:pointer;border:1px solid var(--line2);background:var(--panel2);border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap}
  .chip:hover{color:var(--ink)} .chip .dot{width:9px;height:9px;border-radius:50%}
  .chip.on{color:var(--ink);border-width:1.5px}
  .chip[data-ph="all"].on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .chip.on[data-ph]:not([data-ph="all"]){filter:none}
  .chip .cc{opacity:.6;font-weight:700}
  .board{overflow:auto;max-height:calc(100vh - 168px)}
  .boardinner{position:relative;min-width:1720px}
  svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6;overflow:visible}
  table.grid{border-collapse:separate;border-spacing:0;width:100%;position:relative;z-index:1}
  .grid th,.grid td{vertical-align:top;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
  .grid thead th{position:sticky;top:0;background:var(--panel2);z-index:10;padding:12px 15px;text-align:left}
  .colh .cl{font-size:14px;font-weight:750} .colh .csub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .colh .cth{font-size:11px;color:var(--faint);margin-top:4px;line-height:1.4;max-width:200px}
  .colh .cst{font-size:10px;font-weight:700;letter-spacing:.05em;padding:1px 6px;border-radius:5px;margin-top:6px;display:inline-block}
  .colh.done .cst{background:var(--c1s);color:var(--c1)} .colh.plan .cst{background:var(--panel);border:1px solid var(--line2);color:var(--faint)}
  th.corner{position:sticky;left:0;z-index:12;background:var(--panel2);width:210px;min-width:210px}
  td.arow{position:sticky;left:0;z-index:8;background:var(--panel);width:210px;min-width:210px;padding:14px}
  .an{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;font-weight:800;font-size:12px;color:#fff}
  .arow h3{font-size:14px;margin:8px 0 4px} .arow p{font-size:11.5px;color:var(--muted);margin:0;line-height:1.5}
  .arow .cnt{float:right;font-size:11.5px;color:var(--faint);font-weight:600}
  td.cell{padding:11px;min-width:214px;width:214px}
  .card{background:var(--panel);border:1px solid var(--line2);border-left:4px solid var(--pc);border-radius:10px;
    padding:11px 12px;margin-bottom:9px;cursor:pointer;transition:.13s;position:relative}
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(10,18,28,.13)}
  .card .num{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:6px;color:#fff;font-size:11px;font-weight:800;background:var(--pc)}
  .card.done .num{font-size:0} .card.done .num::after{content:"✓";font-size:12px}
  .cardhd{display:flex;align-items:center;gap:8px}
  .card h4{font-size:13px;margin:0;font-weight:700;flex:1;line-height:1.35}
  .card .cd{font-size:11.5px;color:var(--muted);margin:6px 0 0;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .foot{display:flex;align-items:center;gap:7px;margin-top:8px;flex-wrap:wrap}
  .tg{font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px}
  .tg.st{background:var(--pc);color:#fff} .tg.plan{background:transparent;color:var(--pc);border:1px solid var(--pc)}
  .tg.tk{background:var(--panel2);border:1px solid var(--line2);color:var(--muted)}
  .tg.dep{background:transparent;color:var(--faint);border:1px dashed var(--line2)}
  .empty{color:var(--faint);font-size:18px;text-align:center;padding:16px 0;opacity:.35}
  .card.hide{display:none}
  .card.dim{opacity:.28;filter:grayscale(.3)} .card.rel{box-shadow:0 0 0 2px var(--pc),0 8px 20px rgba(10,18,28,.14)}
  .card.focus{box-shadow:0 0 0 2.5px var(--pc),0 12px 28px rgba(10,18,28,.2);transform:translateY(-2px)}
  path.link{fill:none;stroke-width:2;opacity:.85}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(6,12,22,.55);backdrop-filter:blur(3px);display:none;place-items:center;z-index:60;padding:24px}
  .ov.show{display:grid}
  .modal{background:var(--panel);border:1px solid var(--line2);border-radius:18px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.42);position:relative}
  .mhd{padding:22px 24px 16px;border-bottom:1px solid var(--line);border-top:5px solid var(--pc);border-radius:18px 18px 0 0}
  .mhd .mtags{display:flex;gap:8px;align-items:center;margin-bottom:9px;flex-wrap:wrap}
  .mph{font-size:11.5px;font-weight:700;color:#fff;background:var(--pc);padding:3px 9px;border-radius:6px}
  .marea{font-size:12px;color:var(--muted);font-weight:600} .mst{font-size:12px;font-weight:700}
  .mhd h2{font-size:20px;margin:0;letter-spacing:-.01em}
  .mx{position:absolute;top:15px;right:17px;cursor:pointer;color:var(--faint);font-size:26px;line-height:1;background:none;border:0}
  .mbody{padding:8px 24px 24px}
  .fld{margin-top:17px} .fld .fl{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--pc);text-transform:uppercase;margin-bottom:6px}
  .fld p{font-size:14px;color:var(--ink);margin:0;line-height:1.65}
  .fld ul{margin:0;padding-left:2px;list-style:none} .fld li{font-size:13px;color:var(--muted);line-height:1.55;padding:3px 0 3px 22px;position:relative}
  .fld li::before{content:"";position:absolute;left:4px;top:10px;width:6px;height:6px;border-radius:2px;background:var(--pc);opacity:.7}
  .deps{display:flex;gap:8px;flex-wrap:wrap} .depchip{font-size:12px;padding:4px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--muted);cursor:pointer}
  .depchip:hover{color:var(--ink);border-color:var(--brand)}
  .mbody code{font-family:var(--mono);font-size:12px;background:var(--panel2);padding:1px 5px;border-radius:4px;color:var(--ink)}
  .decbox{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--pc);border-radius:10px;padding:12px 14px;font-size:12.5px;line-height:1.75;color:var(--muted)}
  .decbox .hi{color:var(--ink);font-weight:650}
  .mlink{display:inline-flex;gap:7px;margin-top:20px;color:var(--brand);font-weight:600;font-size:13.5px;text-decoration:none}
  .foot{padding:14px 26px 40px;color:var(--faint);font-size:12px;line-height:1.7}
  .themebtn{position:fixed;top:18px;right:22px;z-index:30;width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);cursor:pointer;font-size:15px}
  @media(max-width:640px){th.corner,td.arow{width:132px;min-width:132px}.arow p{display:none}.top h1{font-size:18px}}
</style>

<button class="themebtn" id="themebtn" title="切換主題">◐</button>
<div class="top">
  <div class="t1"><span class="kick">Planning · Area × Phase</span><h1>綠電媒合平台 · Roadmap</h1><span class="meta" id="stat"></span></div>
  <div class="sub">每張卡＝一個功能項目，顏色＝階段。<b>Phase 1–3 是已上線（我們先做的）；Phase 4–7 是邁向正式發佈的規劃。</b> 點卡片看目標 / 好處 / 工項 / 驗收 / 依賴；<b>滑過卡片會亮出關聯連線</b>。對照 <code>docs/PRD.md</code>。　<a href="board.html" style="color:var(--brand);font-weight:600;text-decoration:none">🧲 任務看板（拖拉）→</a></div>
  <div class="chips" id="chips"></div>
</div>
<div class="board" id="board"><div class="boardinner" id="inner"><svg class="links" id="links"></svg><table class="grid" id="grid"></table></div></div>
<div class="foot">階段＝主題與優先序分組（非固定日期）；實際時程／Sprint 依團隊資源另訂。<b style="color:var(--muted)">Phase 5（部署與資安）與相關驗收，是「真的要產品化」的必要前置</b>；GA 判準見 PRD 第 8 節。</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>

<script src="roadmap-data.js"></script>
<script>
const {PH,PHS,AREAS,ITEMS,byId}=RM;

let filter='all';
const $=s=>document.querySelector(s), cv=n=>getComputedStyle(document.documentElement).getPropertyValue('--c'+n).trim();
function stats(){const done=ITEMS.filter(i=>i.done).length;$('#stat').innerHTML=`<b>${AREAS.length}</b> 領域 · <b>${ITEMS.length}</b> 功能卡 · <b>${done}</b> 已上線 · <b>${ITEMS.length-done}</b> 規劃中`;}
function chips(){
 const cc={all:ITEMS.length};PHS.forEach(p=>cc[p]=ITEMS.filter(i=>i.ph===p).length);
 let h=`<div class="chip on" data-ph="all">全部 <span class="cc">${cc.all}</span></div>`;
 PHS.forEach(p=>{h+=`<div class="chip" data-ph="${p}" style="--pc:var(--c${PH[p].c})"><span class="dot" style="background:var(--c${PH[p].c})"></span>${PH[p].n} <span class="cc">${cc[p]}</span></div>`;});
 $('#chips').innerHTML=h;
 $('#chips').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;filter=c.dataset.ph;
  document.querySelectorAll('.chip').forEach(x=>{x.classList.toggle('on',x===c);if(x===c&&x.dataset.ph!=='all')x.style.background=`var(--c${PH[+x.dataset.ph].c}s)`;else if(x.dataset.ph!=='all')x.style.background='';});
  apply();};
}
function grid(){
 let h='<thead><tr><th class="corner"><div class="colh"><div class="cl" style="font-size:12.5px;color:var(--muted)">領域 / 功能</div></div></th>';
 PHS.forEach(p=>{h+=`<th class="colh ${PH[p].done?'done':'plan'}" style="--pc:var(--c${PH[p].c})"><div class="cl" style="color:var(--c${PH[p].c})">${PH[p].n}</div><div class="csub">${PH[p].t}</div><div class="cth">${PH[p].th}</div><span class="cst">${PH[p].done?'✓ 已上線':'規劃中'}</span></th>`;});
 h+='</tr></thead><tbody>';
 AREAS.forEach(ar=>{const items=ITEMS.filter(i=>i.a===ar.id);
  h+=`<tr><td class="arow"><span class="cnt">${items.length}</span><span class="an" style="background:var(--c${ar.c})">${ar.id}</span><h3>${ar.n}</h3><p>${ar.d}</p></td>`;
  PHS.forEach(p=>{const cs=items.filter(i=>i.ph===p);h+='<td class="cell">'+(cs.length?cs.map(cardHTML).join(''):'<div class="empty">·</div>')+'</td>';});
  h+='</tr>';});
 $('#grid').innerHTML=h+'</tbody>';
 document.querySelectorAll('.card').forEach(c=>{
  c.onclick=()=>openM(c.dataset.id);
  c.onmouseenter=()=>hoverLinks(c.dataset.id);
  c.onmouseleave=clearLinks;
 });
}
function cardHTML(it){
 const pc=`var(--c${PH[it.ph].c})`;
 let foot=it.done?'<span class="tg st">✓ 已上線</span>':'<span class="tg plan">規劃中</span>';
 if(it.tasks&&it.tasks.length)foot+=`<span class="tg tk">${it.tasks.length} 工項</span>`;
 if(it.deps.length)foot+=`<span class="tg dep">↳ ${it.deps.length} 依賴</span>`;
 return `<div class="card ${it.done?'done':''}" data-id="${it.id}" style="--pc:${pc}">
  <div class="cardhd"><span class="num">${it.n}</span><h4>${it.t}</h4></div>
  <p class="cd">${it.d}</p><div class="foot">${foot}</div></div>`;
}
function visible(it){return filter==='all'||String(it.ph)===filter;}
function apply(){
 document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hide',!visible(byId[c.dataset.id])));
 document.querySelectorAll('#grid tbody tr').forEach(tr=>tr.querySelectorAll('td.cell').forEach(td=>{
  const vis=[...td.querySelectorAll('.card')].some(c=>!c.classList.contains('hide'));
  let e=td.querySelector('.empty');if(!vis&&!e){e=document.createElement('div');e.className='empty';e.textContent='·';td.appendChild(e);}
  if(e)e.style.display=vis?'none':'block';
 }));
 clearLinks();
}
// ── 依賴連線 ──
const svg=$('#links'), inner=$('#inner');
function cardEl(id){return document.querySelector('.card[data-id="'+id+'"]');}
function pos(el){const r=el.getBoundingClientRect(),ir=inner.getBoundingClientRect();return {x:r.left-ir.left,y:r.top-ir.top,w:r.width,h:r.height};}
function hoverLinks(id){
 const it=byId[id];clearLinks();
 const rel=new Set([...it.deps,...it.dependents].filter(r=>byId[r]&&visible(byId[r])));
 if(!rel.size)return;
 const from=cardEl(id);if(!from)return;const fp=pos(from);
 let paths='';
 rel.forEach(rid=>{
  const to=cardEl(rid);if(!to)return;const tp=pos(to);
  const isDep=it.deps.includes(rid); // this depends on rid
  const a=isDep?tp:fp, b=isDep?fp:tp; // arrow points to the dependent (下游)
  const x1=a.x+a.w/2,y1=a.y+a.h/2,x2=b.x+b.w/2,y2=b.y+b.h/2;
  const dx=Math.abs(x2-x1)*0.4;
  const col=`var(--c${PH[it.ph].c})`;
  paths+=`<path class="link" d="M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}" stroke="${col}" marker-end="url(#arr)"/>`;
  cardEl(rid).classList.add('rel');
 });
 svg.innerHTML=`<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--c${PH[it.ph].c})"/></marker></defs>`+paths;
 from.classList.add('focus');
 document.querySelectorAll('.card').forEach(c=>{if(c!==from&&!c.classList.contains('rel')&&!c.classList.contains('hide'))c.classList.add('dim');});
}
function clearLinks(){svg.innerHTML='';document.querySelectorAll('.card').forEach(c=>c.classList.remove('rel','dim','focus'));}
$('#board').addEventListener('scroll',clearLinks);
// ── modal ──
function openM(id){
 const it=byId[id],pc=`var(--c${PH[it.ph].c})`;
 const tasks=(it.tasks||[]).map(t=>`<li>${t}</li>`).join('');
 const deps=it.deps.map(d=>`<span class="depchip" onclick="openM('${d}')">↳ ${byId[d].t}</span>`).join('');
 const dpts=it.dependents.map(d=>`<span class="depchip" onclick="openM('${d}')">${byId[d].t} ↴</span>`).join('');
 $('#modal').style.setProperty('--pc',cv(PH[it.ph].c));
 $('#modal').innerHTML=`<button class="mx" onclick="closeM()">&times;</button>
  <div class="mhd"><div class="mtags"><span class="mph">${PH[it.ph].n} · ${PH[it.ph].t}</span><span class="marea">領域 ${it.a}·${AREAS.find(a=>a.id===it.a).n} #${it.n}</span><span class="mst" style="color:${it.done?'var(--c1)':pc}">${it.done?'✓ 已上線':'○ 規劃中'}</span></div><h2>${it.t}</h2></div>
  <div class="mbody">
   <div class="fld"><div class="fl">目標</div><p>${it.goal}</p></div>
   <div class="fld"><div class="fl">好處 / 為何</div><p>${it.benefit}</p></div>
   <div class="fld"><div class="fl">${it.done?'已完成工項':'工項'}（${it.tasks.length}）</div><ul>${tasks}</ul></div>
   ${it.decision?`<div class="fld"><div class="fl">🎯 選型建議（決策）</div><div class="decbox">${it.decision}</div></div>`:''}
   ${deps?`<div class="fld"><div class="fl">依賴（先做）</div><div class="deps">${deps}</div></div>`:''}
   ${dpts?`<div class="fld"><div class="fl">被誰依賴（下游）</div><div class="deps">${dpts}</div></div>`:''}
   ${it.link?`<a class="mlink" href="${it.link}" target="_blank" rel="noopener">↗ 打開相關頁面（線上 Demo）</a>`:''}
  </div>`;
 $('#ov').classList.add('show');
}
function closeM(){$('#ov').classList.remove('show');}
$('#ov').onclick=e=>{if(e.target.id==='ov')closeM();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});
$('#themebtn').onclick=()=>{const r=document.documentElement,c=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.setAttribute('data-theme',c==='dark'?'light':'dark');clearLinks();};
stats();chips();grid();apply();
</script>
